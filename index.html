<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMEN NORD — кейс</title>
<meta name="description" content="Сайт для северного глэмпинга из стеклянных куполов. Дизайн: Татьяна Тагмазян.">
<meta property="og:title" content="LUMEN NORD"><meta property="og:image" content="og.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600&family=Prata&display=swap">
<style>
:root{--bg:#02050b;--ink:#f1eee6;--mut:#7d8c99;--line:rgba(255,255,255,.12);--acc:#4fe3ff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:28px 24px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px 24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
h1{margin:0;font-size:clamp(26px,5vw,44px);font-weight:600;letter-spacing:-.03em}
h1 span{font-family:Prata,serif;font-weight:400;letter-spacing:.14em;color:var(--mut);margin-left:.15em}
.meta{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:14px;color:var(--mut)}.meta b{color:var(--ink);font-weight:500}
.cv{margin:0 0 14px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07101a;cursor:zoom-in}
.cv img{display:block;width:100%;height:auto}
.cv figcaption{position:absolute;left:12px;top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfd8df;background:rgba(2,5,11,.6);padding:4px 10px;border-radius:999px;border:1px solid var(--line);opacity:0;transition:.2s}
.cv:hover figcaption{opacity:1}
footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.hint{display:none;font-size:13px;color:var(--mut);margin:0 0 14px}
#lb{position:fixed;inset:0;background:rgba(2,5,11,.96);display:none;overflow:auto;z-index:10;-webkit-overflow-scrolling:touch}
#lb.on{display:block}#lb img{display:block;width:230vw;max-width:none;height:auto}
#lb button{position:fixed;right:14px;top:14px;z-index:11;border:1px solid var(--line);background:rgba(2,5,11,.8);color:var(--ink);font:500 14px Inter;padding:10px 16px;border-radius:999px}
@media(max-width:760px){.wrap{padding:18px 12px 60px}.cv{border-radius:10px;margin-bottom:10px}.cv figcaption{opacity:1;font-size:10px}.hint{display:block}}
@media(min-width:761px){#lb img{width:min(100vw,1920px)}}
</style></head><body><div class="wrap">
<header><h1>LUMEN<span>NORD</span></h1>
<div class="meta"><span><b>Сайт</b> для северного глэмпинга</span><span><b>Роль</b> Татьяна Тагмазян</span><span><b>2026</b></span></div></header>
<p class="hint">Нажмите на экран кейса, чтобы увеличить.</p>
  <figure class="cv" data-n="01"><img src="c/01.jpg" alt="Обложка: ноутбук в куполе с главной LUMEN NORD" loading="eager" width="1920"><figcaption>01 · Cover</figcaption></figure>
  <figure class="cv" data-n="02"><img src="c/02.jpg" alt="Задача и чат с гостем в телефоне" loading="eager" width="1920"><figcaption>02 · Task</figcaption></figure>
  <figure class="cv" data-n="03"><img src="c/03.jpg" alt="Решение: уют, который чувствуется с экрана" loading="lazy" width="1920"><figcaption>03 · Solution</figcaption></figure>
  <figure class="cv" data-n="04"><img src="c/04.jpg" alt="Чем заняться на территории" loading="lazy" width="1920"><figcaption>04 · Activities</figcaption></figure>
  <figure class="cv" data-n="05"><img src="c/05.jpg" alt="Снаружи — Север, внутри — тепло" loading="lazy" width="1920"><figcaption>05 · Concept</figcaption></figure>
  <figure class="cv" data-n="06"><img src="c/06.jpg" alt="Знак и палитра" loading="lazy" width="1920"><figcaption>06 · Brand & visual language</figcaption></figure>
  <figure class="cv" data-n="07"><img src="c/07.jpg" alt="Сайт целиком" loading="lazy" width="1920"><figcaption>07 · Full site</figcaption></figure>
  <figure class="cv" data-n="08"><img src="c/08.jpg" alt="3D-купол и его зоны" loading="lazy" width="1920"><figcaption>08 · Inside the dome</figcaption></figure>
  <figure class="cv" data-n="09"><img src="c/09.jpg" alt="Дни на Севере" loading="lazy" width="1920"><figcaption>09 · Stay experience</figcaption></figure>
  <figure class="cv" data-n="10"><img src="c/10.jpg" alt="Фотосессия: галерея в телефоне" loading="lazy" width="1920"><figcaption>10 · Photoshoot</figcaption></figure>
  <figure class="cv" data-n="11"><img src="c/11.jpg" alt="Маршрут от аэропорта" loading="lazy" width="1920"><figcaption>11 · Route & logistics</figcaption></figure>
  <figure class="cv" data-n="12"><img src="c/12.jpg" alt="Мобильное бронирование" loading="lazy" width="1920"><figcaption>12 · Mobile experience</figcaption></figure>
  <figure class="cv" data-n="13"><img src="c/13.jpg" alt="Контакты" loading="lazy" width="1920"><figcaption>13 · Contact</figcaption></figure>
<footer><span>Татьяна Тагмазян · Brand &amp; Digital Designer</span><span><a href="https://t.me/tatiana_tgmzn">Telegram</a> · <a href="mailto:Tanya51rus@gmail.com">Tanya51rus@gmail.com</a></span></footer>
</div>
<div id="lb"><button type="button">Закрыть</button><img alt=""></div>
<script>
const lb=document.getElementById('lb'),li=lb.querySelector('img');
document.querySelectorAll('.cv').forEach(f=>f.addEventListener('click',()=>{li.src=f.querySelector('img').src;lb.classList.add('on');lb.scrollTop=0;lb.scrollLeft=0;document.body.style.overflow='hidden'}));
const close=()=>{lb.classList.remove('on');document.body.style.overflow=''};
lb.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'||innerWidth>760)close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
